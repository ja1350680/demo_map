<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa con PostGIS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.4);
        }
        .popup-title {
            color: #0d6efd;
            font-size: 1.2em;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
        }
        .popup-category {
            background-color: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map').setView([16.7534, -93.1153], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        fetch('api.php')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.marker(latlng); 
                    },
                    onEachFeature: function (feature, layer) {
                        const props = feature.properties;
                        const popupContent = `
                            <div class="popup-title">${props.nombre}</div>
                            <div class="popup-category">${props.categoria}</div>
                            <p>${props.descripcion}</p>
                        `;
                        layer.bindPopup(popupContent);
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Error cargando los datos:', error);
                alert('No se pudieron cargar los puntos del mapa.');
            });

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            const nombre = prompt("Nombre del nuevo lugar:");
            if (!nombre) return; 

            const descripcion = prompt("Descripción breve (opcional):") || "Sin descripción";
            const categoria = prompt("Categoría (Parque, Edificio, etc):") || "General";

            fetch('api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, descripcion, categoria, lat, lng })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ Lugar guardado correctamente');
                    location.reload(); 
                } else {
                    alert('❌ Error: ' + data.error);
                }
            })
            .catch(err => alert('Error de red al guardar'));
        });

    </script>
</body>
</html>
